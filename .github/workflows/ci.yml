name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: it_center_security_cloud
          POSTGRES_USER: itcenter
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itcenter -d it_center_security_cloud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AGENT_API_KEY: test-key
      DATABASE_URL: postgresql://itcenter:change-me@127.0.0.1:5432/it_center_security_cloud?connect_timeout=5
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Apply migrations
        run: python backend/apply_migrations.py

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local Docker Compose
        run: docker compose -f infra/docker-compose.yml config -q

      - name: Prepare production config placeholders
        run: |
          cp .env.production.example .env.production
          sed -i 's/REPLACE_WITH_A_LONG_RANDOM_PASSWORD/ci-postgres-password/g' .env.production
          sed -i 's/REPLACE_WITH_A_LONG_RANDOM_API_KEY/ci-agent-api-key/g' .env.production
          sed -i 's/monitor.example.com/ci.example.com/g' .env.production
          mkdir -p .secrets
          printf 'admin:%s\n' 'ci-placeholder' > .secrets/dashboard.htpasswd

      - name: Validate production Docker Compose
        run: docker compose --env-file .env.production -f infra/docker-compose.production.yml config -q
