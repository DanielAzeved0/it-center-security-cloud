name: SSH Access Recovery

# ATENCAO: workflow de uso unico.
# Executar via workflow_dispatch, confirmar acesso, e remover este arquivo do repositorio imediatamente apos.
# Padrao identico ao INCIDENTE 018 (docs/deployment/POSTMORTEMS.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inject-key:
    name: Inject SSH public key into authorized_keys
    runs-on: ubuntu-latest

    steps:
      - name: Add public key to VM authorized_keys
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/prod_key
          chmod 600 /tmp/prod_key

          PORT="${SSH_PORT:-22}"

          PUBLIC_KEY="ssh-rsa  ssh-key-2026-06-26"

          ssh -i /tmp/prod_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -p "$PORT" \
            "$SSH_USER@$SSH_HOST" \
            "grep -qxF '$PUBLIC_KEY' ~/.ssh/authorized_keys || echo '$PUBLIC_KEY' >> ~/.ssh/authorized_keys && echo 'KEY ADDED' || echo 'KEY ALREADY PRESENT'"

      - name: Verify SSH access with new key
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          echo "ssh-rsa  ssh-key-2026-06-26" > /tmp/new_key.pub
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" | head -c 10 > /dev/null  # only to avoid leaking; actual verify uses new key file approach

          # Write the private key from Downloads (stored as secret for this step)
          # Since we don't have the private key as a secret, we verify via the prod key instead
          PORT="${{ secrets.PROD_SSH_PORT }}"
          PORT="${PORT:-22}"

          echo "New public key injected. Test manually from your machine:"
          echo "  ssh -i C:/Users/gizad/Downloads/ssh-key-2026-06-26.key -p $PORT ubuntu@${{ secrets.PROD_SSH_HOST }}"
