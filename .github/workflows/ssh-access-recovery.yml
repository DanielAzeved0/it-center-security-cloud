name: SSH Access Recovery

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Chave publica SSH (ssh-ed25519 AAAA... comentario) a ser adicionada ao authorized_keys da VM"
        required: true
        type: string

permissions:
  contents: read

jobs:
  add-key:
    name: Add recovery SSH key to VM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -p "${PROD_SSH_PORT:-22}" "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Append recovery public key on VM
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          NEW_KEY: ${{ inputs.public_key }}
        run: |
          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_USER"
          ssh -i ~/.ssh/production_key -p "${PROD_SSH_PORT:-22}" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "NEW_KEY='$NEW_KEY' sh -s" <<'REMOTE'
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          if ! grep -qF "$NEW_KEY" ~/.ssh/authorized_keys; then
            printf '%s\n' "$NEW_KEY" >> ~/.ssh/authorized_keys
            echo "Chave adicionada."
          else
            echo "Chave ja presente, nada a fazer."
          fi
          REMOTE
