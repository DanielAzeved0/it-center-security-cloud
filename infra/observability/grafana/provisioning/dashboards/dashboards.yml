# Provider que carrega os dashboards JSON versionados em
# infra/observability/grafana/dashboards/ automaticamente no startup.
apiVersion: 1

providers:
  - name: itcenter-edge-node
    orgId: 1
    folder: "Edge Node"
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 300
    options:
      path: /var/lib/grafana/dashboards
