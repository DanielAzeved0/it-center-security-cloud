services:
  postgres:
    image: postgres:16-alpine
    container_name: itcenter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_center_security_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-itcenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
    container_name: itcenter-backend
    restart: unless-stopped
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-itcenter}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-it_center_security_cloud}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../frontend/dashboard
    container_name: itcenter-frontend
    restart: unless-stopped
    environment:
      ITCENTER_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
